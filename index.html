
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(
        135deg,
        #09001f,
        #170b3b,
        #001f3f,
        #09001f
    );
    background-size: 300% 300%;
    animation: gradientMove 10s ease infinite;

    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.calculator {
    width: 100%;
    max-width: 320px;
    background: rgba(20, 15, 40, 0.9);
    padding: 22px;
    border-radius: 22px;
    border: 1px solid rgba(167, 139, 250, 0.3);
    box-shadow: 0 0 35px rgba(100, 50, 255, 0.3);
}

h2 {
    text-align: center;
    color: white;
    margin-top: 0;
    letter-spacing: 2px;
}

#display {
    width: 100%;
    height: 65px;
    margin-bottom: 18px;
    font-size: 28px;
    text-align: right;
    padding: 12px;
    border: 1px solid #5941a9;
    border-radius: 12px;
    background: #100b24;
    color: white;
    outline: none;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 58px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: #292344;
    color: white;
    transition: 0.2s;
}

button:hover {
    background: #493a78;
    transform: translateY(-2px);
}

button:active {
    transform: scale(0.95);
}

.operator {
    background: #5634a5;
}

.operator:hover {
    background: #7952d6;
}

.clear {
    background: #c03959;
}

.clear:hover {
    background: #e34d70;
}

.equal {
    background: #168d75;
    grid-column: span 2;
}

.equal:hover {
    background: #20b997;
}

#salary {
    display: none;
    margin-top: 20px;
    padding: 18px;
    text-align: center;
    background: #100b24;
    border: 1px solid #5941a9;
    border-radius: 14px;
    color: white;
    animation: pop 0.4s ease;
}

@keyframes pop {
    from {
        opacity: 0;
        transform: scale(0.8);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

#salary h3 {
    font-size: 13px;
    color: #b8a6f5;
    letter-spacing: 2px;
}

#salaryAmount {
    font-size: 28px;
    font-weight: bold;
    color: #50e38a;
    margin: 12px 0;
    text-shadow: 0 0 12px rgba(80, 227, 138, 0.4);
}

#salary p {
    font-size: 12px;
    color: #aaa;
}

.footer {
    text-align: center;
    color: #8d82b5;
    font-size: 11px;
    margin-top: 18px;
}
</style>
</head>

<body>

<div class="calculator">

    <h2>NEON CALC</h2>

    <input type="text" id="display" readonly placeholder="0">

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="append('/')">÷</button>
        <button class="operator" onclick="append('*')">×</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('-')">−</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('+')">+</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('.')">.</button>

        <button onclick="append('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>

    </div>

    <div id="salary">
        <h3>💼 YOUR MONTHLY SALARY</h3>
        <div id="salaryAmount"></div>
        <p>Congratulations! You're employed! 😂</p>
    </div>

    <div class="footer">
        NEON CALC • JUST FOR FUN
    </div>

</div>

<script>

const display = document.getElementById("display");

function append(value) {
    if (display.value === "Error") {
        display.value = "";
    }

    display.value += value;
    hideSalary();
}

function clearDisplay() {
    display.value = "";
    hideSalary();
}

function deleteLast() {
    display.value = display.value.slice(0, -1);
    hideSalary();
}

function hideSalary() {
    document.getElementById("salary").style.display = "none";
}

function calculate() {
    try {
        if (!display.value ||
            !/^[0-9+\-*/.() ]+$/.test(display.value)) {
            throw new Error();
        }

        const result = Function(
            '"use strict"; return (' + display.value + ')'
        )();

        if (!Number.isFinite(result)) {
            throw new Error();
        }

        display.value = Number(result.toFixed(8));

        // Random salary between ₱15,000 and ₱150,000
        const salary = Math.floor(
            Math.random() * 135001
        ) + 15000;

        document.getElementById("salaryAmount").textContent =
            "₱" + salary.toLocaleString("en-PH");

        document.getElementById("salary").style.display = "block";

    } catch {
        display.value = "Error";
        hideSalary();
    }
}

// Keyboard support
document.addEventListener("keydown", function(event) {

    if (/^[0-9.+\-*/()]$/.test(event.key)) {
        append(event.key);
    }

    else if (event.key === "Enter" || event.key === "=") {
        calculate();
    }

    else if (event.key === "Backspace") {
        deleteLast();
    }

    else if (event.key === "Escape") {
        clearDisplay();
    }

});

</script>

</body>
</html>
