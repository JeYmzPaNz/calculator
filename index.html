
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Calculator</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.calculator {
    background: #222;
    padding: 20px;
    border-radius: 15px;
    width: 260px;
}

#display {
    width: 100%;
    height: 55px;
    margin-bottom: 15px;
    font-size: 28px;
    text-align: right;
    box-sizing: border-box;
    padding: 10px;
    border: none;
    border-radius: 8px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

button {
    height: 55px;
    font-size: 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: #444;
    color: white;
}

button:hover {
    background: #666;
}

.operator {
    background: orange;
}

.clear {
    background: #d94343;
}

.equal {
    background: #269b50;
    grid-column: span 2;
}

#salary {
    display: none;
    margin-top: 18px;
    padding: 15px;
    background: #333;
    color: white;
    text-align: center;
    border-radius: 10px;
}

#salary h3 {
    margin: 0 0 10px;
    color: #aaa;
}

#salaryAmount {
    font-size: 25px;
    color: #50e38a;
    font-weight: bold;
}

</style>
</head>

<body>

<div class="calculator">

    <input type="text" id="display" readonly>

    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">AC</button>
        <button onclick="deleteLast()">DEL</button>
        <button class="operator" onclick="append('/')">÷</button>
        <button class="operator" onclick="append('*')">×</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('-')">−</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('+')">+</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('.')">.</button>

        <button onclick="append('0')">0</button>
        <button class="equal" onclick="calculate()">=</button>
    </div>

    <div id="salary">
        <h3>💼 YOUR MONTHLY SALARY</h3>
        <div id="salaryAmount"></div>
        <p>Congratulations! You're employed! 😂</p>
    </div>

</div>

<script>

const display = document.getElementById("display");

function append(value) {
    if (display.value === "Error") display.value = "";
    display.value += value;
    hideSalary();
}

function clearDisplay() {
    display.value = "";
    hideSalary();
}

function deleteLast() {
    display.value = display.value.slice(0, -1);
    hideSalary();
}

function hideSalary() {
    document.getElementById("salary").style.display = "none";
}

function calculate() {
    try {
        if (!/^[0-9+\-*/.() ]+$/.test(display.value)) {
            throw new Error();
        }

        const result = Function(
            '"use strict"; return (' + display.value + ')'
        )();

        if (!Number.isFinite(result)) throw new Error();

        display.value = Number(result.toFixed(8));

        // Random monthly salary from ₱15,000 to ₱150,000
        const salary = Math.floor(Math.random() * 135001) + 15000;

        document.getElementById("salaryAmount").textContent =
            "₱" + salary.toLocaleString("en-PH");

        document.getElementById("salary").style.display = "block";

    } catch {
        display.value = "Error";
        hideSalary();
    }
}

</script>

</body>
</html>
